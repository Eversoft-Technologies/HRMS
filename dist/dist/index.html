  <script>
    /* Theme controller — applies light/dark before first paint (no flash). */
    (function () {
      var KEY = "hrms-theme";              // stored choice: "light" | "dark"
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var ICONS = {
        light: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.3"/><path d="M8 1v1.5M8 13.5V15M15 8h-1.5M2.5 8H1M12.36 3.64l-1.06 1.06M4.7 11.3l-1.06 1.06M12.36 12.36l-1.06-1.06M4.7 4.7L3.64 3.64" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
        dark: '<svg viewBox="0 0 16 16" fill="none"><path d="M13.5 9.2A5.5 5.5 0 116.8 2.5a4.4 4.4 0 006.7 6.7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>'
      };
      function getChoice() {
        var c = localStorage.getItem(KEY);
        if (c !== "light" && c !== "dark") {
          // Migrate off the removed "system" setting (or a first visit) to the
          // theme it was already resolving to, so nothing changes underfoot.
          c = mq.matches ? "dark" : "light";
          try { localStorage.setItem(KEY, c); } catch (_) {}
        }
        return c;
      }
      function apply() {
        var c = getChoice();
        document.documentElement.setAttribute("data-theme", c);
        document.documentElement.setAttribute("data-theme-choice", c);
        var btn = document.getElementById("theme-toggle");
        if (btn) {
          btn.innerHTML = ICONS[c] || ICONS.light;
          btn.title = "Theme: " + c.charAt(0).toUpperCase() + c.slice(1) + " (click to change)";
        }
      }
      window.__applyTheme = apply;
      window.__cycleTheme = function () {
        var next = getChoice() === "dark" ? "light" : "dark";
        localStorage.setItem(KEY, next);
        apply();
      };
      apply(); // before paint — avoids flash of wrong theme
      window.addEventListener("DOMContentLoaded", function () {
        document.documentElement.classList.add("theme-ready"); // enable transitions after load
        // Re-apply when the React-rendered toggle button mounts (and fill its icon).
        new MutationObserver(function () {
          var btn = document.getElementById("theme-toggle");
          if (btn && !btn.dataset.ready) { btn.dataset.ready = "1"; apply(); }
        }).observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>

  <script>
    (function () {
      function updateInterviewPlaceholders() {
        var isInterviewPage = location.pathname.replace(/\/+$/, '').indexOf('/recruit/interview') === 0;
        if (!isInterviewPage) {
          var hiddenRows = document.querySelectorAll('.card > [data-hrms-interview-placeholder]');
          Array.prototype.forEach.call(hiddenRows, function (row) {
            row.style.display = row.getAttribute('data-hrms-interview-placeholder');
            row.removeAttribute('data-hrms-interview-placeholder');
          });
          return;
        }
        Array.prototype.forEach.call(document.querySelectorAll('.card-title'), function (title) {
          var name = (title.textContent || '').trim();
          if (name !== 'Upcoming Interviews' && name !== 'Recently Completed') return;
          var card = title.closest('.card') || title.parentNode;
          Array.prototype.forEach.call(card.children, function (row) {
            if (row === title || row.id === 'hrms-iv-up' || row.id === 'hrms-iv-done') return;
            if (!row.hasAttribute('data-hrms-interview-placeholder')) {
              row.setAttribute('data-hrms-interview-placeholder', row.style.display);
            }
            if (row.style.display !== 'none') row.style.display = 'none';
          });
        });
      }
      new MutationObserver(updateInterviewPlaceholders).observe(document.documentElement, {
        childList: true, subtree: true, attributes: true, attributeFilter: ['style']
      });
      window.addEventListener('popstate', updateInterviewPlaceholders);
      window.addEventListener('hrmsNavigate', updateInterviewPlaceholders);
      updateInterviewPlaceholders();
    })();
  </script>
  <script>
    (function () {
      var key = 'hrms-last-route';
      var rootPaths = { '/': true, '/index.html': true, '/dashboard': true };
      function currentRoute() {
        return location.pathname + location.search + location.hash;
      }
      function saveRoute() {
        try {
          var route = currentRoute();
          if (!rootPaths[location.pathname]) sessionStorage.setItem(key, route);
          else sessionStorage.removeItem(key);
        } catch (error) {
          console.warn('[HRMS route restore] Could not access session storage:', error);
        }
      }

      var navigation = performance.getEntriesByType('navigation')[0];
      var isReload = navigation && navigation.type === 'reload';
      if (isReload && rootPaths[location.pathname]) {
        try {
          var lastRoute = sessionStorage.getItem(key);
          if (lastRoute && !rootPaths[lastRoute.split(/[?#]/)[0]]) {
            history.replaceState(history.state, '', lastRoute);
          }
        } catch (error) {
          console.warn('[HRMS route restore] Could not restore the previous route:', error);
        }
      } else {
        saveRoute();
      }

      ['pushState', 'replaceState'].forEach(function (method) {
        var original = history[method];
        history[method] = function () {
          var result = original.apply(this, arguments);
          saveRoute();
          return result;
        };
      });
      window.addEventListener('popstate', saveRoute);
    })();
  </script>
  <script>
    (function () {
      var key = 'hrms-reload-followup-panel';
      var followupTitle = 'Candidate Follow-up Status';

      function findFollowupPanel() {
        var titles = document.querySelectorAll('.card-title');
        for (var i = 0; i < titles.length; i++) {
          if ((titles[i].textContent || '').trim() === followupTitle) {
            return titles[i].closest('.card') || titles[i].parentNode;
          }
        }
        return null;
      }

      function savePanelOnReload() {
        if (location.pathname.replace(/\/+$/, '') !== '/recruit/interview') return;
        var panel = findFollowupPanel();
        if (!panel) return;
        var rect = panel.getBoundingClientRect();
        var isVisible = rect.top < window.innerHeight && rect.bottom > 0;
        try {
          if (isVisible) sessionStorage.setItem(key, '1');
          else sessionStorage.removeItem(key);
        } catch (error) {
          console.warn('[HRMS panel restore] Could not save follow-up panel state:', error);
        }
      }
      window.addEventListener('pagehide', savePanelOnReload);

      if (location.pathname.replace(/\/+$/, '') !== '/recruit/interview') {
        try {
          sessionStorage.removeItem(key);
        } catch (error) {
          console.warn('[HRMS panel restore] Could not clear follow-up panel state:', error);
        }
        return;
      }

      var navigation = performance.getEntriesByType('navigation')[0];
      if (!navigation || navigation.type !== 'reload') return;

      try {
        if (sessionStorage.getItem(key) !== '1') return;
        sessionStorage.removeItem(key);
      } catch (error) {
        console.warn('[HRMS panel restore] Could not read follow-up panel state:', error);
        return;
      }

      var restored = false;
      function restorePanel() {
        if (restored) return;
        var panel = findFollowupPanel();
        if (!panel) return;
        restored = true;
        observer.disconnect();
        panel.scrollIntoView({ block: 'start' });
      }

      var observer = new MutationObserver(restorePanel);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', restorePanel, { once: true });
      }
      restorePanel();
    })();
  </script>
